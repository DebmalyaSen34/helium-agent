[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helium-agent"
version = "0.1.1"
description = "A terminal-focused AI agent with RAG and local tool capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "requests",
    "numpy",
    "prompt-toolkit",
    "python-dotenv",
    "pyyaml",
    "duckduckgo-search",
    "beautifulsoup4",
    "fastapi",
    "uvicorn[standard]",
    "playwright"
]

[project.optional-dependencies]
voice = [
    "speechrecognition>=3.10.0",
    "kokoro>=0.9.0",
    "sounddevice>=0.4.0",
    "pyaudio>=0.2.11",
    "openwakeword>=0.6.0",
    "mlx-whisper>=0.1.0"
]

[project.scripts]
helium = "main:cli_entrypoint"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "tools", "config", "utils", "rag_service", "memory", "engine"]
