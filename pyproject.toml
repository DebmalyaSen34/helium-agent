[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helium-agent"
version = "0.2.0"
description = "A terminal-focused AI agent with local tool capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich",
    "requests",
    "prompt-toolkit",
    "python-dotenv",
    "pyyaml",
    "ddgs",
    "beautifulsoup4",
    "platformdirs",
    "tomli; python_version < '3.11'"
]

[project.scripts]
helium = "main:cli_entrypoint"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "core",
    "tools",
    "tools.research",
    "tools.search",
    "config",
    "utils",
    "memory",
    "skills"
]

[tool.setuptools.package-data]
config = ["settings.toml"]

[dependency-groups]
dev = ["pytest"]

