services:
  helium:
    image: jarvis-runtime:latest
    build:
      context: .
      dockerfile: Dockerfile.terminal
    command: ["python", "main.py"]
    env_file:
      - .env
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - /workspace/.venv                        # Prevents host .venv from overlaying container
    extra_hosts:
      - "host.docker.internal:host-gateway"
