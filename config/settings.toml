[services]
searxng_url = "http://127.0.0.1:8080/search"

[assistant]
confirm_risky_tools = true
startup_animation = false   # true plays the fusion intro and boot checks before the header
# persona = """..."""  # uncomment to override the built-in persona

[llm]
tool_mode = "auto"          # auto | native | text
read_timeout = 120
context_budget_chars = 300000
max_tool_output_chars = 12000
stop_sequences = []

# Provider-specific request fields sent with every chat request.
# DeepSeek example: reasoning_effort = "high"   (none | low | high | max)
[llm.extra_params]

[agent]
max_turns = 40              # tool turns per request before Helium stops and reports
parallel_safe_tools = true

[browser]
timeout_seconds = 8.0
