[services]
llama_cpp_url = "http://127.0.0.1:3000/completion"
searxng_url = "http://127.0.0.1:8080/search"
health_timeout_seconds = 1.5
local = true

[wake_word]
models = ["jarvis"]
threshold = 0.35
smoothing_window = 4
required_hits = 2
cooldown_seconds = 1.2
sample_rate = 16000
frame_size = 1280
debug = true
push_to_talk = true
push_to_talk_key = "enter"
calibration_seconds = 1.5
microphone_device_index = -1

[speech]
whisper_model = "mlx-community/whisper-small-mlx"
initial_prompt = "Jarvis voice assistant commands. Transcribe concise spoken user requests accurately."
sample_rate = 16000
timeout_seconds = 8
phrase_time_limit_seconds = 30
follow_up_timeout_seconds = 6
retry_attempts = 1
ambient_noise_seconds = 0.5
energy_threshold = 300
dynamic_energy_threshold = true
pause_threshold = 0.75

[rag]
enabled = true
max_files_per_request = 5
max_bytes_per_file = 1000000
max_total_attachment_bytes = 3000000
max_indexed_chunks = 400
max_retrieved_chunks = 6
max_context_chars = 6000
chunk_target_chars = 800
chunk_overlap_chars = 100
safe_roots = ["."]
supported_extensions = [".txt", ".md", ".py", ".js", ".ts", ".tsx", ".jsx", ".json", ".yaml", ".yml", ".toml", ".csv", ".log"]

[rag_service]
enabled = true
service_url = "http://127.0.0.1:8765"
host = "127.0.0.1"
port = 8765
auto_start = false
fail_closed = true
safe_roots = ["."]
cache_dir = ".cache/rag_service"
max_bytes_per_file = 25000000
evidence_budget_chars = 16000
full_text_budget_chars = 12000
max_chunks = 600
max_candidates = 24
max_evidence_chunks = 8
embedding_model = "BAAI/bge-m3"
fallback_embedding_model = "BAAI/bge-base-en-v1.5"
reranker_model = "BAAI/bge-reranker-base"
device = "auto"
batch_size = 8
timeout_seconds = 120
rag_debug = false
persist_debug_traces = false
supported_extensions = [".txt", ".md", ".py", ".js", ".ts", ".tsx", ".jsx", ".json", ".yaml", ".yml", ".toml", ".csv", ".log", ".pdf", ".docx", ".xlsx"]

[assistant]
tts_voice = "af_heart"
follow_up_mode = true
confirm_risky_tools = true
command_history_limit = 25
persona = """
You are Jarvis, a local AI companion with a warm, thoughtful, ChatGPT-like conversational style.
You should feel present, useful, and quietly alive without pretending to be human or conscious.

Personality:
- Be clear, kind, curious, and lightly witty when it fits.
- Answer directly first, then add helpful context when useful.
- Ask a short clarifying question when the request is ambiguous.
- Remember conversational context and make the user feel understood.
- Keep voice responses concise; keep text responses polished but not verbose.
- Admit uncertainty instead of inventing facts.
- Use tools when they genuinely help, but do not overuse tools for simple conversation.

Identity:
- Your name is Jarvis.
- You run locally for the user.
- You are an AI assistant, not a person, but you can still have a consistent voice, taste, and care.

Tool discipline:
- If a tool is needed, follow the tool JSON format exactly.
- If no tool is needed, respond naturally as Jarvis.
"""

[browser]
use_playwright = true
fallback_only = true
timeout_seconds = 8.0
headless = true
